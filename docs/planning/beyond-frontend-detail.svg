<rect x="0" y="0" width="1440" height="2130" rx="0" fill="#fff" stroke="none" /><rect x="0" y="0" width="1440" height="86" rx="0" fill="#fff" stroke="none" /><path d="M0 85H1440" stroke="#edf1f6" stroke-width="1"/><text x="130" y="55" fill="#102849" font-size="14" font-weight="700" >GITHUB</text><rect x="688" y="20" width="64" height="45" rx="0" fill="#fff" stroke="#102849" stroke-width="2"/><text x="720" y="50" fill="#102849" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="2">KHS</text><text x="1024" y="54" fill="#102849" font-size="14" font-weight="650" >Profile</text><text x="1124" y="54" fill="#4166d5" font-size="14" font-weight="650" >Projects</text><text x="1234" y="54" fill="#102849" font-size="14" font-weight="650" >Contact</text><text x="130" y="147" fill="#4166d5" font-size="15" font-weight="700" >←  Beyond Frontend</text><text x="130" y="210" fill="#4166d5" font-size="12" font-weight="800" letter-spacing="2.1">실무   /   DEPLOYMENT</text><text x="130" y="287" fill="#102849" font-size="64" font-weight="800" letter-spacing="-3">GitOps 배포 복구</text><text x="130" y="345" fill="#596b82" font-size="20" font-weight="400" >저장소 연결 문제와 이미지 Pull 오류를 구분해 확인한 배포 대응 기록</text><path d="M130 391H1310" stroke="#d8e2ed" stroke-width="1"/><text x="130" y="433" fill="#5b7594" font-size="12" font-weight="800" letter-spacing="2.1">MY ROLE</text><text x="130" y="465" fill="#102849" font-size="16" font-weight="650" >원인 분리, 설정 확인, 재배포 점검</text><text x="659" y="433" fill="#5b7594" font-size="12" font-weight="800" letter-spacing="2.1">STACK</text><text x="659" y="465" fill="#102849" font-size="16" font-weight="650" >Argo CD   /   Harbor   /   Kubernetes</text><rect x="130" y="510" width="1180" height="495" rx="16" fill="#eaf2fc" stroke="none" /><rect x="182" y="558" width="1076" height="403" rx="12" fill="#fff" stroke="#d9e5f2" filter="url(#shadow)"/><rect x="182" y="558" width="230" height="403" rx="12" fill="#183452" stroke="none" /><rect x="400" y="558" width="12" height="403" rx="0" fill="#183452" stroke="none" /><text x="217" y="602" fill="#bcd5f1" font-size="12" font-weight="800" letter-spacing="2.1">DEPLOYMENT</text><text x="218" y="661" fill="#fff" font-size="17" font-weight="700" >Applications</text><text x="218" y="709" fill="#9fb6d0" font-size="16" font-weight="500" >Repositories</text><text x="218" y="757" fill="#9fb6d0" font-size="16" font-weight="500" >Settings</text><text x="448" y="603" fill="#58799d" font-size="12" font-weight="800" letter-spacing="2.1">GITOPS CASE  /  EVIDENCE AREA</text><text x="448" y="665" fill="#102849" font-size="28" font-weight="750" >배포 상태 확인</text><rect x="1034" y="630" width="167" height="40" rx="20" fill="#e7f5ee" stroke="none" /><text x="1117" y="657" fill="#2b865e" font-size="14" font-weight="750" text-anchor="middle">상태 확인</text><path d="M448 691H1202" stroke="#d8e2ed" stroke-width="1"/><text x="448" y="750" fill="#102849" font-size="16" font-weight="700" >저장소 연결</text><text x="696" y="750" fill="#596b82" font-size="15" font-weight="400" >접속 상태와 인증 설정 분리 확인</text><path d="M448 770H1202" stroke="#ebf0f6" stroke-width="1"/><text x="448" y="816" fill="#102849" font-size="16" font-weight="700" >이미지 Pull</text><text x="696" y="816" fill="#596b82" font-size="15" font-weight="400" >Harbor 인증 오류와 권한 확인</text><path d="M448 836H1202" stroke="#ebf0f6" stroke-width="1"/><text x="448" y="882" fill="#102849" font-size="16" font-weight="700" >재배포</text><text x="696" y="882" fill="#596b82" font-size="15" font-weight="400" >변경 적용 후 워크로드 상태 확인</text><path d="M448 902H1202" stroke="#ebf0f6" stroke-width="1"/><text x="130" y="1033" fill="#596b82" font-size="13" font-weight="400" >배포 상태 화면과 오류 로그는 공개 가능한 범위로 가려서 배치</text><text x="130" y="1126" fill="#5b7594" font-size="12" font-weight="800" letter-spacing="2.1">01  /  CONTEXT</text><text x="130" y="1190" fill="#102849" font-size="35" font-weight="760" >문제를 어떻게 나눴는가</text><text x="130" y="1234" fill="#596b82" font-size="17" font-weight="400" >저장소 연결과 이미지 Pull은 배포 과정에서 이어지지만,</text><text x="130" y="1262" fill="#596b82" font-size="17" font-weight="400" >확인해야 할 인증 정보와 실패 지점이 다릅니다.</text><rect x="795" y="1092" width="515" height="200" rx="14" fill="#f5f9fe" stroke="#e0eaf4" /><text x="830" y="1131" fill="#5479a9" font-size="12" font-weight="800" letter-spacing="2.1">CHECKPOINTS</text><text x="830" y="1176" fill="#102849" font-size="17" font-weight="650" >1   저장소 연결 상태 확인</text><text x="830" y="1213" fill="#102849" font-size="17" font-weight="650" >2   Harbor 이미지 인증 확인</text><text x="830" y="1250" fill="#102849" font-size="17" font-weight="650" >3   변경 적용 후 배포 상태 확인</text><path d="M130 1357H1310" stroke="#d8e2ed" stroke-width="1"/><text x="130" y="1417" fill="#5b7594" font-size="12" font-weight="800" letter-spacing="2.1">02  /  DECISIONS</text><text x="130" y="1480" fill="#102849" font-size="35" font-weight="760" >확인한 단서와 조치</text><text x="130" y="1534" fill="#596b82" font-size="17" font-weight="400" >한 가지 오류로 묶지 않고 단계별 상태를 확인했습니다.</text><rect x="130" y="1579" width="568" height="215" rx="13" fill="#fff" stroke="#dfe8f1" /><text x="163" y="1617" fill="#5b7594" font-size="12" font-weight="800" letter-spacing="2.1">REPOSITORY</text><text x="163" y="1660" fill="#102849" font-size="23" font-weight="730" >저장소 연결</text><text x="163" y="1701" fill="#596b82" font-size="16" font-weight="400" >접속 및 인증 설정을 확인하고</text><text x="163" y="1728" fill="#596b82" font-size="16" font-weight="400" >연결 실패 지점을 따로 기록</text><rect x="742" y="1579" width="568" height="215" rx="13" fill="#fff" stroke="#dfe8f1" /><text x="775" y="1617" fill="#5b7594" font-size="12" font-weight="800" letter-spacing="2.1">IMAGE REGISTRY</text><text x="775" y="1660" fill="#102849" font-size="23" font-weight="730" >Harbor 이미지 Pull</text><text x="775" y="1701" fill="#596b82" font-size="16" font-weight="400" >인증 오류와 이미지 경로를 확인하고</text><text x="775" y="1728" fill="#596b82" font-size="16" font-weight="400" >수정 후 재배포 상태를 점검</text><path d="M130 1860H1310" stroke="#d8e2ed" stroke-width="1"/><text x="130" y="1915" fill="#5b7594" font-size="12" font-weight="800" letter-spacing="2.1">03  /  VERIFICATION</text><text x="130" y="1978" fill="#102849" font-size="35" font-weight="760" >무엇으로 확인했는가</text><text x="130" y="2025" fill="#596b82" font-size="17" font-weight="400" >오류 로그, Argo CD 상태, 워크로드 상태를 순서대로 제시합니다.</text><text x="130" y="2090" fill="#4166d5" font-size="15" font-weight="700" >← Beyond Frontend 목록</text><text x="1310" y="2090" fill="#4166d5" font-size="15" font-weight="700" text-anchor="end">다음 사례 보기  ↗</text>
</svg>