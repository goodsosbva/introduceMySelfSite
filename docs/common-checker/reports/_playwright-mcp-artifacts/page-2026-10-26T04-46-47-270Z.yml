                  - listitem [ref=e1392]:
                    - strong [ref=e1393]: 최유렬 (백엔드)
                    - text: "- AI 해커톤이 제공하는 특강을 통해 프로젝트를 다양한 측면에서 고민해볼 수 있어 좋았고, 더 좋은 제품을 만들기 위해 LLM을 어떻게 사용할 수 있을지 고민하고 도입해본 경험이 유익했던 것 같습니다."
                  - listitem [ref=e1394]:
                    - strong [ref=e1395]: 안지원 (프론트엔드)
