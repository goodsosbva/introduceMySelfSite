                  - text: 대형 플랫폼의 후속 진입에도 경쟁우위가 지속되는 이유는 크게 두 가지임. 첫째, 추천 로직의 청년 자격 판정 정밀도가 높아지고 데이터가 쌓일수록
                  - strong [ref=e689]: 청년을 타겟으로 한 추천이 정확해지는 선순환 구조
