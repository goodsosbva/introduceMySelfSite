                    - text: 상태로, 정책은 있으나 대상 청년에게 도달하지 못하고 있음. Y-Fin.이 이러한 발견과 신청 격차를 좁힘.
                  - listitem [ref=e701]:
                    - strong [ref=e702]: 포용금융 실현
                    - text: "- 금융 정보 비대칭을 용어 풀이로 완화하고, 광고금리가 아닌"
                    - strong [ref=e703]: 세후 실수령액을 표시해 다크패턴에 따른 금리 오인 가입을 차단
                    - text: 함. 영남권 청년 우선 접근으로 지역 격차에도 대응함.
