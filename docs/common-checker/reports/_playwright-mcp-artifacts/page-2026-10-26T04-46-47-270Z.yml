                    - text: "- 어떻게 AI를 서비스와 기능에 유의미하게 사용할 수 있을지 고민할 수 있는 해커톤이었습니다. 다양한 특강, 멘토링, 네트워킹에 참여하며, 초기 서비스를 AI 흐름에 발맞춰 고도화할 수 있었습니다."
