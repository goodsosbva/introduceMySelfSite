                - paragraph [ref=e680]:
                  - text: 기존 서비스는 두 축 중 하나만 채움. 공공 서비스는 상품 범위는 넓으나 개인화가 부재하고, 핀테크 서비스는 개인화는 일부 지원하나 정책상품 커버리지가 부족함. 은행 서비스들은 자행 상품 추천에 편향되어 있음. Y-Fin.은
                  - strong [ref=e681]: 정부·은행 통합 + 청년 맞춤 추천이라는, 어떤 경쟁사도 서 있지 않은 화이트 스페이스
                  - text: 에 위치함.
                - paragraph [ref=e682]:
