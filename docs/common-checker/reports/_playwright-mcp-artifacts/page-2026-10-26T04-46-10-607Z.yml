                - generic [ref=e534]:
                  - heading "프로젝트 배경" [level=4] [ref=e535]
                  - 'link "Permalink: 프로젝트 배경" [ref=e536] [cursor=pointer]':
                    - /url: "#프로젝트-배경"
                - list [ref=e539]:
                  - listitem [ref=e540]: 사용자 맞춤 부품 추천 쇼핑몰
                  - listitem [ref=e541]: 고사양을 요하지 않는 일반 PC 사용자들은 기기 전체를 바꾸는 것보다 필요한 부분만 간단히 업그레이드하는 것이 가격적인 측면에서 이득이 있다. 하지만 부품의 호환성, 업그레이드 범위, 관련된 추가 제품을 파악하는 일은 일반 사용자에게 쉽지 않다. “Tech-Up”은 그런 사용자들을 위한 가벼운 업그레이드 추천 중심의 서비스이다. 고객이 등록한 본인 제품 정보 및 사용자 행동(제품 구매, 위시리스트, 장바구니 등)을 바탕으로 연관된 상품을 제공한다.
                - list [ref=e542]:
                  - listitem [ref=e543]:
                    - code [ref=e544]: 연관성 높은 제품 추천
                    - text: ": 사용자가 등록하거나 사이트에서 구매한 자신의 제품에 관한 데이터를 분석하여 연관 제품을 제안하고, 사용자의 현재 제품 사양에 기반하여 간단한 업그레이드(예: RAM 용량 증가, SSD 용량 확장, CPU 코어 수 증가 등) 중심으로 추천하는 데 중점을 둔다."
                    - list [ref=e545]:
                      - listitem [ref=e546]: 대략적인 제품 간 호환성 자동 판단을 제공하며, 더 자세한 사항은 커뮤니티 게시글 기능을 통해 찾아갈 수 있다.
                  - listitem [ref=e547]:
                    - code [ref=e548]: 즉각적인 추천 제품 구매
                    - text: ": 다른 사이트와 달리 제품 간 비교 페이지에서 추천받은 제품은 즉시 장바구니에 담아 주문할 수 있다."
                  - listitem [ref=e549]:
                    - code [ref=e550]: 커뮤니티 형성
                    - text: ": 회원 간의 부품 호환성에 관한 지식 공유를 통해 협력 문화를 조성한다."
                - generic [ref=e551]:
                  - heading "세부 기능" [level=4] [ref=e552]
                  - 'link "Permalink: 세부 기능" [ref=e553] [cursor=pointer]':
                    - /url: "#세부-기능"
                - list [ref=e556]:
                  - listitem [ref=e557]:
                    - code [ref=e558]: 제품 목록/상세 조회
                    - text: 검색, 제품 카테고리 및 필터로 목록을 조회하고 상세 정보를 확인할 수 있는 기능
                  - listitem [ref=e559]:
                    - code [ref=e560]: 기기 등록
                    - text: 사용자가 본인의 기기를 등록하고 관리할 수 있는 기능
                  - listitem [ref=e561]:
                    - code [ref=e562]: 장바구니 & 위시리스트
                    - text: 사용자가 관심있는 제품을 담고 취소하며 관리할 수 있는 기능
                  - listitem [ref=e563]:
                    - code [ref=e564]: 주문/결제
                    - text: 사용자가 원하는 제품을 주문하고 결제할 수 있는 기능
                  - listitem [ref=e565]:
                    - code [ref=e566]: 상품 리뷰
                    - text: 사용자가 제품에 대해 별점과 리뷰를 남길 수 있는 기능
                  - listitem [ref=e567]:
                    - code [ref=e568]: 마이페이지
                    - text: 사용자가 개인 정보 및 활동 내역을 조회하고 관리할 수 있는 기능
                  - listitem [ref=e569]:
                    - code [ref=e570]: 알림
                    - text: 사용자에게 공통 알림, 개인 알림(주문 완료, 재입고, 품절임박 등)을 제공하는 기능
                  - listitem [ref=e571]:
                    - code [ref=e572]: 추천
                    - text: 사용자가 등록한 제품과 유사한 제품, 유사한 사용자가 관심있어한 제품 등 사용자 행동 기반 개인화 추천 기능
                  - listitem [ref=e573]:
                    - code [ref=e574]: 쿠폰 이벤트
                    - text: 선착순 쿠폰 및 사용자 지정 쿠폰을 제공하는 기능
                  - listitem [ref=e575]:
                    - code [ref=e576]: 기타 지식을 공유하는 커뮤니티
                    - text: 사용자가 개인의 경험 및 지식을 공유할 수 있는 공간을 제공하는 기능
                  - listitem [ref=e577]:
                    - code [ref=e578]: 어드민
                    - text: 매출, 판매량, TOP위시리스트 등 통계량을 확인할 수 있는 대시보드와 쿠폰 발급, 알림 발행, 사용자/제품 관리 등의 관리 기능 제공
                - generic [ref=e579]:
                  - heading "🏗️ 시스템 아키텍처" [level=2] [ref=e580]
                  - 'link "Permalink: 🏗️ 시스템 아키텍처" [ref=e581] [cursor=pointer]':
                    - /url: "#️-시스템-아키텍처"
                - link [ref=e585] [cursor=pointer]:
                  - /url: /beyond-sw-camp/be12-fin-404Found-Tech-Up-BE/blob/main/images/readme/techup_final_sys_arch.png
                - generic [ref=e587]:
                  - heading "📚 백엔드 프로젝트 목표" [level=2] [ref=e588]
                  - 'link "Permalink: 📚 백엔드 프로젝트 목표" [ref=e589] [cursor=pointer]':
                    - /url: "#-백엔드-프로젝트-목표"
                - list [ref=e592]:
                  - listitem [ref=e593]:
                    - code [ref=e594]: API 설계 및 개발
                    - list [ref=e595]:
                      - listitem [ref=e596]: 클라이언트(프론트엔드)에서 호출할 수 있도록 RESTful API를 설계하고 개발합니다.
                      - listitem [ref=e597]: HTTP 메서드를 명확히 구분하여 표준에 맞는 엔드포인트 구조를 구성합니다.
                      - listitem [ref=e598]: Swagger를 활용해 API 문서화를 지원하며, 프론트엔드와의 협업을 원활하게 합니다.
                  - listitem [ref=e599]:
                    - code [ref=e600]: 추천 시스템 구현
                    - list [ref=e601]:
                      - listitem [ref=e602]: 추천 결과는 Python, Kafka, ElasticSearch를 이용하여 실시간으로 데이터를 전처리 및 적재하여 빠르게 유사도 검색을 가능하도록 설계합니다.
                  - listitem [ref=e603]:
                    - code [ref=e604]: 성능 최적화
                    - list [ref=e605]:
                      - listitem [ref=e606]:
                        - code [ref=e607]: Redis
                        - list [ref=e608]:
                          - listitem [ref=e609]: 선착순 처리 로직 (재고 관리 및 선착순 쿠폰 발급)에 Redis를 사용해 빠른 읽기/쓰기 처리를 지원합니다.
                          - listitem [ref=e610]: 캐싱(유저의 장바구니 담기)에 Redis를 활용하여 DB 부하를 줄입니다.
                      - listitem [ref=e611]:
                        - code [ref=e612]: ElasticSearch
                        - list [ref=e613]:
                          - listitem [ref=e614]: 대용량 데이터에서 빠르고 유연한 검색 기능을 제공합니다.
                      - listitem [ref=e615]: 배치를 통한 N+1 문제 예방을 통해 자원 낭비를 방지합니다.
